include: package:flutter_lints/flutter.yaml

# Lines up to 120 characters. With the default 80, the formatter splits one-line `if` statements, which then
# trip curly_braces_in_flow_control_structures.
formatter:
  page_width: 120

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
