name: architecture_sample
description: "Reference app for leaf-architecture: Clean Architecture + MVVM with Riverpod."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Shared foundation. The repository is leaf-architecture; the Dart package keeps the underscore.
  leaf_architecture:
    git:
      url: https://github.com/leafworks-team/leaf-architecture.git
      ref: v3.0.0

  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  auto_route: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # 2.17 moves to build 5, which riverpod_generator does not support yet.
  build_runner: ">=2.16.1 <2.17.0"
  # 4.0.2+ needs analyzer 14; auto_route_generator stops at analyzer 13.
  freezed: ">=4.0.1 <4.0.2"
  json_serializable: ^6.15.2
  retrofit_generator: ^10.3.3
  riverpod_generator: ^4.0.9
  auto_route_generator: ^10.6.0

flutter:
  uses-material-design: true
  generate: true
